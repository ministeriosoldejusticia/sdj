<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Radio Sol de Justicia</title>
<link rel="icon" type="image/png" href="logo.ico">

  <!-- Descripción para buscadores -->
  <meta name="description" content="Ministerio Sol de Justicia - Iglesia Misión Evangélica Sol de Justicia es un faro de esperanza y fe en Florencio Varela, Buenos Aires. Nacida para predicar el evangelio y servir a la comunidad, continúa llevando un mensaje de amor y compromiso con los más necesitados.">

  <!-- Palabras clave -->
  <meta name="keywords" content="iglesia, ministerio, cristiano, oración, fe, biblia, Jesús, Sol de Justicia">

  <!-- Autor -->
  <meta name="author" content="Ministerio Sol de Justicia">

  
  <link rel="icon" href="https://ministeriosoldejusticia.com.ar/logo.ico">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    .radio {
      width: 320px;
      padding: 20px;
      text-align: center;
      background: #181818;
      border-radius: 14px;
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    audio {
      width: 100%;
      height: 40px;
    }

    .contacto {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #333;
      font-size: 12px;
      line-height: 1.6;
      color: #aaa;
    }

    .contacto h3 {
      margin: 0 0 8px;
      font-size: 14px;
      color: #fff;
    }

    .contacto p {
      margin: 4px 0;
    }
  </style>
</head>

<body>

  <div class="radio">

    <img
      class="logo"
      src="https://ministeriosoldejusticia.com.ar/logo.ico"
      alt="Sol de Justicia"
    >

    <audio id="radio" controls autoplay>
      <source
        src="https://stream-176.zeno.fm/y9teefnmlxpuv"
        type="audio/mpeg"
      >
      Tu navegador no soporta el audio en línea.
    </audio>

    <div class="contacto">
      <h3>Pedidos de Oración</h3>
      <p>+54 11 66627585</p>
      <p>Lunes a Domingos las 24 horas</p>
    </div>

  </div>

  <script>
    const radio = document.getElementById("radio");

    radio.play().catch(() => {
      // El navegador puede bloquear el autoplay.
  </script>

</body>
</html>
