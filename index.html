<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ministerio Sol de Justicia</title>

  <link rel="icon" type="image/png" href="logo.ico">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      /* Fondo blanco y negro */
      background:
        radial-gradient(circle at center, #222 0%, #111 45%, #000 100%);

      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 25px;
    }

    .contenedor {
      width: 100%;
      max-width: 950px;
      text-align: center;
    }

    /* SOL DE JUSTICIA */
    .marca {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 40px;
    }

    .sol {
      width: 32px;
      height: 32px;
      background: #f1c40f;
      border-radius: 50%;
      box-shadow:
        0 0 15px rgba(241, 196, 15, 0.45),
        0 0 35px rgba(241, 196, 15, 0.15);
    }

    .marca span {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(42px, 8vw, 78px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: -2px;
      margin-bottom: 25px;
    }

    h1 .amarillo {
      color: #f1c40f;
    }

    .mensaje {
      max-width: 680px;
      margin: 0 auto 45px;
      color: #cfcfcf;
      font-size: 18px;
      line-height: 1.7;
    }

    /* REPRODUCTOR */
    .radio {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .radio iframe {
      border: 0;
      width: 100%;
      max-width: 760px;
      height: 260px;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
    }

    .pie {
      margin-top: 35px;
      color: #777;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* MÓVILES */
    @media (max-width: 600px) {

      body {
        padding: 18px;
      }

      .marca {
        margin-bottom: 30px;
      }

      .marca span {
        font-size: 14px;
        letter-spacing: 3px;
      }

      .sol {
        width: 25px;
        height: 25px;
      }

      h1 {
        font-size: 48px;
      }

      .mensaje {
        font-size: 16px;
        line-height: 1.6;
      }

      .radio iframe {
        height: 260px;
      }

      .pie {
        letter-spacing: 2px;
      }
    }
  </style>
</head>

<body>

  <main class="contenedor">

    <div class="marca">
      <div class="sol"></div>
      <span>Sol de Justicia</span>
    </div>

    <h1>
      Ministerio<br>
      <span class="amarillo">Sol de Justicia</span>
    </h1>

    <p class="mensaje">
      Nuestro sitio web se encuentra en construcción.
      Estamos preparando un nuevo espacio para continuar
      llevando el mensaje de Jesucristo a las naciones.
    </p>

    <div class="radio">

      <iframe
        src="https://player.cdnrad.com/sdj"
        style="border:0;width:100%;max-width:760px;height:260px"
        allow="autoplay">
      </iframe>

    </div>

    <div class="pie">
      A las naciones
    </div>

  </main>

</body>
</html>
